name: Sorsogon Portal Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - configure-sorsogon-province

permissions:
  contents: read

concurrency:
  group: sorsogon-portal-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate configuration, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test CSV formula protection and exports
        run: npm run test:csv

      - name: Verify Sorsogon scope against live Budget API
        run: npm run check -- --verbose

      - name: Lint source
        run: npm run lint

      - name: Build static portal
        run: npm run build

  production-dependency-gate:
    name: Block known production dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Fail when production dependencies have known moderate or higher advisories
        run: npm audit --omit=dev --audit-level=moderate

  dependency-audit:
    name: Read-only dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Audit locked dependencies without applying fixes
        shell: bash
        run: |
          set -euo pipefail
          for scope in all production; do
            report="$(mktemp)"
            audit_args=(--json)
            if [ "$scope" = production ]; then audit_args=(--omit=dev --json); fi
            status=0
            npm audit "${audit_args[@]}" > "$report" || status=$?
            node - "$report" "$scope" "$status" <<'NODE'
          const fs = require('node:fs');
          const [file, scope, exitStatus] = process.argv.slice(2);
          let audit;
          try { audit = JSON.parse(fs.readFileSync(file, 'utf8')); }
          catch { console.error('Invalid audit JSON for', scope); process.exit(1); }
          if (!audit.metadata?.vulnerabilities || !audit.vulnerabilities || Number(exitStatus) > 1 || audit.error) {
            console.error('npm audit failed:', scope, 'exit status', exitStatus, audit.error?.code || 'missing report');
            process.exit(1);
          }
          console.log('\n=== ' + scope.toUpperCase() + ' dependency audit ===');
          console.log('Counts:', JSON.stringify(audit.metadata.vulnerabilities));
          for (const [name, issue] of Object.entries(audit.vulnerabilities).sort(([a], [b]) => a.localeCompare(b))) {
            const advisories = (issue.via || []).filter(v => typeof v === 'object').map(v => ({
              title: v.title, url: v.url, range: v.range
            }));
            console.log(JSON.stringify({
              package: name, severity: issue.severity, direct: issue.isDirect,
              vulnerableRange: issue.range, fixAvailable: issue.fixAvailable,
              paths: issue.nodes, affects: issue.effects, advisories
            }));
          }
          NODE
            rm -f "$report"
          done
